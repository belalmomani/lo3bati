name: Build Apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🔄 Checkout repository
      - uses: actions/checkout@v3

      # ☕ Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      # 🛠 Setup Android NDK
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1.5.0
        with:
          ndk-version: r28c

      # 🔧 Ensure gradlew is executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 🔑 Signing keystore (Modified for Lo3bati)
      # With the secret KEYSTORE_BASE64 the release keystore is restored to app/Star4droid.jks.
      # Without it a debug keystore is generated so the build can finish (test APK only; the key changes on every run).
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/app/Star4droid.jks"
            echo "Using the release keystore from secrets."
          else
            for d in "$HOME/.android" "$HOME/.config/.android"; do
              mkdir -p "$d"
              if [ ! -f "$d/debug.keystore" ]; then
                keytool -genkeypair -keystore "$d/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              fi
            done
            echo "No KEYSTORE_BASE64 secret: using a generated debug keystore (test APK)."
          fi

      # ⚡ Build APK
      - name: Build APK with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease

      # 📦 Upload APK as artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: engine.apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
